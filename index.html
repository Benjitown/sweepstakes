<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sweepstakes</title>
<meta name="description" content="Minesweeper, but you're gambling. Dig for multipliers, cash out before you hit a mine, or go double or nothing.">
<meta name="theme-color" content="#0f2f27">
<link rel="icon" href="assets/icon.svg">
<!-- one stylesheet per area; this order is the cascade order (tools/build.py inlines them in the same order) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/run-panel.css">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="css/boards.css">
<link rel="stylesheet" href="css/shop.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/daily.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/household.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="crt" id="crt" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <aside class="run panel" aria-label="Your run">
    <div class="logo"><svg aria-hidden="true"><use href="#i-bomb"/></svg><span>Sweep<b>$</b>takes</span></div>
    <div class="inset bankbox"><span class="lbl">Coins</span><div class="bank" id="bank" title="Your coins"><svg aria-hidden="true"><use href="#i-coin"/></svg><span id="coins" class="num">1,000</span></div></div>
    <div class="inset rank" id="rank"><div class="rk"><b id="rankLv">Lv 1</b><span id="rankName">Tile Toddler</span></div><span class="xpbar"><i></i></span></div>
    <div class="chips" id="chips"><span class="lvchip" id="lvChip">Lv 1</span>
      <div class="ascbadge" id="ascBadge" hidden><svg aria-hidden="true"><use href="#i-asc"/></svg><span class="long"></span><span class="short"></span></div>
      <div class="streak" id="streak" hidden title="Win streak: bonus on profit"><svg aria-hidden="true"><use href="#i-flame"/></svg><span class="long"></span><span class="short"></span></div>
      <div class="goldchip" id="goldChip" hidden title="Golden boards waiting for you"><svg aria-hidden="true"><use href="#i-crown"/></svg><span class="long"></span><span class="short"></span></div>
      <button class="chirpchip" id="chirpChip" type="button" hidden title="The smoke detector wants a new battery"><svg aria-hidden="true"><use href="#i-battery"/></svg><span class="long">Change the battery</span><span class="short">Fix</span></button></div>
    <div class="inset goal" id="goal"><span class="lbl goal-l"></span><span class="goal-bar"><i></i></span></div>
    <div class="run-actions">
      <button class="btn red big don" id="btnDon" type="button"><svg class="ic" aria-hidden="true"><use href="#i-dice"/></svg><span class="long">Double or nothing</span><span class="short">Double</span></button>
      <button class="btn gold spin" id="btnSpin" type="button"><svg class="ic" aria-hidden="true"><use href="#i-wheel"/></svg><span class="long" id="spinLbl">Free spin!</span><span class="short" id="spinShort">Spin!</span></button>
      <div class="row">
        <button class="btn blue" id="btnFlip" type="button"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span class="long">Coin flip</span><span class="short">Flip</span></button>
        <button class="btn ghost iconbtn" id="btnMute" type="button" aria-label="Mute sounds"><svg aria-hidden="true"><use href="#i-sound"/></svg></button>
      </div>
    </div>
  </aside>

  <section class="play" aria-label="Tables and boards">
    <div class="addons panel" id="addons"></div>
    <div class="tables" id="tables" role="tablist" aria-label="Tables"></div>
    <div class="stake panel">
      <label for="stakeRange">Stake</label>
      <input type="range" id="stakeRange" min="0" max="1000" value="0">
      <output id="stakeOut" for="stakeRange" class="num">0</output>
      <div class="quick">
        <button data-q="min" type="button">Min</button>
        <button data-q="half" type="button">Half</button>
        <button data-q="max" type="button">Max</button>
      </div>
      <button class="btn blue" id="dealAll" type="button">Deal all</button>
      <p class="tinfo" id="tinfo"></p>
    </div>
    <div class="boards" id="boards"></div>
    <p class="hint">Click to dig, right-click or long-press to flag, tap a number to clear around it. Safe digs pay a little. Risky digs pay the odds. Gems hide where the opening doesn’t reach.</p>
  </section>

  <aside class="side">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="shop" aria-selected="true" aria-controls="shop">Upgrades</button>
        <button role="tab" type="button" data-tab="rack" aria-selected="false" aria-controls="rack">Add-ons</button>
        <button role="tab" type="button" data-tab="stats" aria-selected="false" aria-controls="stats">Stats</button>
      </div>
      <div id="shop" class="shop" role="tabpanel"></div>
      <div id="rack" role="tabpanel" hidden></div>
      <div id="stats" class="stats" role="tabpanel" hidden></div>
    </div>
    <div class="panel">
      <h2>The Group Chat<small>5 members, 0 sense</small></h2>
      <div id="chat" class="chat" aria-live="polite"></div>
    </div>
  </aside>
</div>

<div id="modal" class="modal-wrap" hidden><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="banner" class="banner" hidden aria-live="polite"></div>
<div id="coach" class="coach" hidden><div class="coach-ring" id="coachRing"></div><div class="coach-bubble" id="coachBubble" role="dialog" aria-label="Tutorial"></div></div>
