<style>
/* Layout: three columns on desktop: sticky run panel (left), play area (add-ons, tables, stake, boards), shop + group chat (right).
   Two columns under 1180px (shop drops below), one column under 760px with the run panel as a sticky top bar.
   World: a smoky card room. Swirling pixel felt behind slate panels, pixel type, chunky lipped buttons, CRT scanlines. */
:root{
  --bg:#0f2f27;
  --panel:#35474c; --panel-in:#222e32; --panel-hi:#4b5f65; --rim:#5b7379; --shadow:#11181a;
  --ink:#ffffff; --ink-dim:#a9bdc2;
  --red:#fe5f55; --red-lo:#b3362e; --blue:#009dff; --blue-lo:#00609f; --orange:#ffa31a; --orange-lo:#ad6800;
  --green:#3fc18a; --green-lo:#1f7d55; --gold:#ffd23f; --gold-lo:#b98a00; --purple:#a275f0; --purple-lo:#6741ae;
  --tile:#6d8c96; --tile-hi:#93b3bd; --tile-lo:#3a5159; --open:#1b2629;
  --pixel:'Tiny5','Courier New',ui-monospace,monospace;
  --big:'Jersey 10','Tiny5','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--pixel);font-size:16px;line-height:1.35;font-synthesis:none;min-height:100vh;text-shadow:0 2px 0 rgba(0,0,0,.35)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.2em}
.num{font-variant-numeric:tabular-nums}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;background:radial-gradient(circle at 30% 25%,#2f8a66,#0d3328 70%)}
.crt{position:fixed;inset:0;pointer-events:none;z-index:85;background:repeating-linear-gradient(180deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:18px;padding-block:18px 40px;padding-inline:16px;max-width:1680px;margin:0 auto;align-items:start}
@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr)}.side{grid-column:1 / -1;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border-radius:14px;box-shadow:0 0 0 3px var(--rim),0 7px 0 3px var(--shadow);padding:14px;min-width:0}
.inset{background:var(--panel-in);border-radius:10px;padding:8px 10px}
h2{font-family:var(--big);font-weight:400;font-size:1.7rem;line-height:1;margin:0 0 10px;letter-spacing:.02em;text-wrap:balance}
h2 small{font-family:var(--pixel);font-size:.8rem;color:var(--ink-dim);margin-left:6px;white-space:nowrap}
.lbl{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.hint{font-size:.82rem;color:var(--ink-dim);margin:0;text-shadow:none}

/* buttons */
.btn{--c:var(--orange);--cl:var(--orange-lo);font-family:var(--pixel);font-weight:700;font-size:1rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);border:0;border-radius:10px;
  padding:.55em 1em;background:var(--c);box-shadow:0 4px 0 var(--cl);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  transition:transform .06s,box-shadow .06s,filter .1s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--cl)}
.btn:disabled{cursor:not-allowed;filter:grayscale(.85) brightness(.65)}
.btn.red{--c:var(--red);--cl:var(--red-lo)} .btn.blue{--c:var(--blue);--cl:var(--blue-lo)} .btn.green{--c:var(--green);--cl:var(--green-lo)}
.btn.gold{--c:var(--gold);--cl:var(--gold-lo);color:#3b2b00;text-shadow:none} .btn.purple{--c:var(--purple);--cl:var(--purple-lo)} .btn.ghost{--c:var(--panel-hi);--cl:var(--shadow)}
.btn.big{font-size:1.15rem;padding:.6em 1em}
.btn.don{animation:pulse 1.6s ease-in-out infinite}
.btn.don:disabled{animation:none}
.iconbtn{padding:0;width:46px;min-height:44px}
.iconbtn svg{width:26px;height:26px}

/* run panel */
.run{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.run > *{min-width:0}
.run .btn{white-space:normal;text-align:center;line-height:1.1}
.logo{font-family:var(--big);font-size:2.3rem;line-height:.9;color:#fff;text-shadow:0 3px 0 var(--red-lo),0 6px 0 rgba(0,0,0,.4);transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;gap:6px;padding-top:4px}
.logo svg{width:36px;height:36px;flex:none;animation:wobble 3s ease-in-out infinite}
.logo b{color:var(--gold);font-weight:400}
.bank{display:flex;align-items:center;gap:8px;font-family:var(--big);font-size:2.6rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.bank svg{width:36px;height:36px;flex:none}
.bank.bump{animation:bump .35s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips:not(:has(> :not([hidden]):not(.lvchip))){display:none}
.ascbadge{background:var(--purple);box-shadow:0 3px 0 var(--purple-lo);border-radius:8px;padding:3px 10px;font-weight:700;justify-self:start;display:flex;align-items:center;gap:6px}
.ascbadge svg{width:20px;height:20px}
.streak{display:flex;align-items:center;gap:6px;background:var(--red);border-radius:8px;box-shadow:0 3px 0 var(--red-lo);padding:3px 10px 3px 6px;font-weight:700;justify-self:start}
.streak svg{width:22px;height:22px}
.goal-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-bar{display:block;height:12px;border-radius:6px;background:var(--shadow);overflow:hidden;margin-top:6px}
.goal-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s}
.rank{display:grid;gap:6px}
.rk{display:flex;align-items:baseline;gap:8px;min-width:0}
.rk b{font-family:var(--big);font-weight:400;font-size:1.7rem;line-height:1;color:var(--purple);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.rk span{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xpbar{display:block;height:8px;border-radius:6px;background:var(--shadow);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--red));transition:width .4s}
.lvchip{display:none;align-items:center;background:var(--purple);box-shadow:0 3px 0 var(--purple-lo);border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap}
.goldchip{display:flex;align-items:center;gap:6px;background:var(--gold);color:#3b2b00;text-shadow:none;box-shadow:0 3px 0 var(--gold-lo);border-radius:8px;padding:3px 10px 3px 6px;font-weight:700}
.goldchip svg{width:20px;height:20px}
.btn.spin.ready{animation:spinready 1.2s ease-in-out infinite}
.btn.spin.ready svg{animation:spinicon 2.4s linear infinite}
.short{display:none}
.run-actions{display:grid;gap:10px}
.run-actions .row{display:flex;gap:8px}
.run-actions .row .btn{flex:1}
.run-actions .row .iconbtn{flex:none}
@media (max-width:760px){
  .run{top:env(safe-area-inset-top,0px);z-index:30;margin-inline:-16px;margin-top:-18px;border-radius:0 0 16px 16px;
    grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"logo chips bank" "act act act";align-items:center;gap:8px;padding:8px 14px 10px}
  .logo{grid-area:logo;font-size:1.45rem;transform:none;justify-content:flex-start;padding:0}
  .logo svg{width:24px;height:24px}
  .chips{grid-area:chips;flex-wrap:wrap;gap:4px 5px;align-content:center;max-height:48px;overflow:hidden}
  .chips .ascbadge,.chips .streak{font-size:.75rem;padding:2px 6px;white-space:nowrap;gap:3px}
  .chips .goldchip{gap:3px}
  .chips svg{width:16px;height:16px}
  .bankbox{grid-area:bank;justify-self:end;padding:2px 8px}
  .bankbox .lbl,.goal,.rank{display:none}
  .chips{display:flex!important}
  .lvchip{display:inline-flex}
  .chips .lvchip,.chips .goldchip{font-size:.75rem;padding:2px 6px;white-space:nowrap}
  .long{display:none} .short{display:inline}
  .bank{font-size:1.8rem} .bank svg{width:22px;height:22px}
  .run-actions{grid-area:act;display:flex;gap:8px}
  .run-actions .row{display:contents}
  .run-actions .btn{flex:1 1 0;font-size:.9rem;padding:.45em .5em;min-height:40px}
  .run-actions .btn.don{flex:1.25 1 0}
  .run-actions .btn.spin.ready{flex:1.15 1 0}
  .run-actions .iconbtn{flex:none;width:44px}
  .play .tables{flex-wrap:nowrap;overflow-x:auto;padding:6px 4px 12px;margin:-6px -4px 0;scroll-snap-type:x proximity}
  .play .tbl{flex:none;scroll-snap-align:start}
  .play .addons{order:4}
  .play .hint{order:5}
}

/* play column */
.play{display:grid;gap:16px;align-content:start;min-width:0}
.addons{display:grid;gap:10px}
.ahead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ahead h2{margin:0}
.slots{display:flex;gap:12px;flex-wrap:wrap}
.acard{--rc:var(--blue);position:relative;flex:none;width:78px;aspect-ratio:5/7;border:0;border-radius:9px;padding:0;cursor:pointer;background:#eef3f4;
  box-shadow:0 5px 0 rgba(0,0,0,.45);animation:floaty 3.4s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .12s;display:block}
.acard .face{position:absolute;inset:4px;border-radius:6px;background:linear-gradient(170deg,color-mix(in srgb,var(--rc),#fff 18%),var(--rc));display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;justify-items:center;overflow:hidden}
.acard .face svg{width:72%;height:auto;max-height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.acard .nm{font-size:.68rem;line-height:1.05;font-weight:700;text-align:center;padding:0 3px 5px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.acard.uncommon{--rc:var(--green)} .acard.rare{--rc:var(--red)}
button.acard:hover{transform:translateY(-6px) rotate(-3deg) scale(1.06)}
.acard.pop .face{animation:jiggle .5s}
.acard.big{width:120px;animation:none}
.acard.big .nm{font-size:.85rem}
.slot-empty{flex:none;width:78px;aspect-ratio:5/7;border-radius:9px;border:3px dashed rgba(255,255,255,.22)}
.rar{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rar.common{color:var(--blue)} .rar.uncommon{color:var(--green)} .rar.rare{color:var(--red)}

.tables{display:flex;gap:10px;flex-wrap:wrap}
.tbl{border:0;border-radius:12px;padding:7px 12px 7px 9px;background:var(--panel);box-shadow:0 0 0 3px var(--rim),0 5px 0 3px var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;transition:transform .1s}
.tbl .dot{width:14px;height:14px;border-radius:4px;background:var(--tc);flex:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.tbl b{display:block;font-weight:700;line-height:1.15}
.tbl small{display:block;font-size:.75rem;color:var(--ink-dim);text-shadow:none}
.tbl[aria-selected="true"]{box-shadow:0 0 0 3px var(--tc),0 5px 0 3px var(--shadow);transform:translateY(-3px)}
.tbl.locked{opacity:.8}
.tbl.locked svg{width:18px;height:18px}
.stake{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.stake label{font-family:var(--big);font-size:1.5rem;line-height:1}
.stake input[type=range]{flex:1 1 150px;accent-color:var(--blue);min-width:120px}
.stake output{font-family:var(--big);font-size:1.9rem;line-height:1;color:var(--blue);min-width:4ch;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.quick{display:flex;gap:6px}
.quick button{border:0;background:var(--panel-hi);box-shadow:0 3px 0 var(--shadow);border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:700}
.tinfo{flex-basis:100%;margin:0;font-size:.85rem;color:var(--ink-dim);text-shadow:none}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;align-items:start}
.board{background:var(--panel);border-radius:16px;box-shadow:0 0 0 3px var(--rim),0 7px 0 3px var(--shadow);padding:12px;display:grid;gap:10px;position:relative;min-width:0}
.board.shake{animation:shake .45s}
.board.golden{box-shadow:0 0 0 3px var(--gold),0 7px 0 3px var(--gold-lo),0 0 26px rgba(255,210,63,.4);animation:goldglow 1.8s ease-in-out infinite}
.board.golden.shake{animation:shake .45s}
.goldtag{background:var(--gold);color:#3b2b00;border-radius:7px;padding:2px 8px;font-weight:700;text-shadow:none;box-shadow:0 3px 0 var(--gold-lo)}
.gemct{display:inline-flex;align-items:center;gap:3px;background:var(--panel-in);border-radius:7px;padding:1px 7px 1px 3px;font-size:.85rem}
.gemct svg{width:18px;height:18px}
.gemct.all{background:var(--gold);color:#3b2b00;text-shadow:none;animation:bump .4s}
.bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tchip{background:var(--tc);color:#10201a;border-radius:7px;padding:2px 9px;font-weight:700;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.blim{margin-left:auto;font-size:.8rem;color:var(--ink-dim);text-shadow:none}
.bot-on{display:inline-flex;width:24px;height:24px}
.bot-on svg{width:24px;height:24px;animation:bob .6s ease-in-out infinite}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.2fr);align-items:center;gap:6px;background:var(--panel-in);border-radius:12px;padding:8px}
.box{border-radius:9px;padding:3px 6px 5px;text-align:center;box-shadow:0 4px 0 var(--bl);min-width:0}
.box small,.pot small{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.box b,.pot b{display:block;font-family:var(--big);font-weight:400;font-size:1.8rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.stk{background:var(--blue);--bl:var(--blue-lo)} .box.mlt{background:var(--red);--bl:var(--red-lo)}
.box.mlt.bump{animation:bump .3s}
.score.hot .box.mlt{animation:flick .5s steps(2) infinite;box-shadow:0 4px 0 var(--red-lo),0 0 18px rgba(255,163,26,.7)}
.score.blaze{box-shadow:0 0 0 2px var(--orange),0 0 26px rgba(255,120,30,.55)}
.score.blaze .box.mlt{animation:flick .32s steps(2) infinite;background:linear-gradient(180deg,var(--orange),var(--red));box-shadow:0 4px 0 var(--red-lo),0 0 28px rgba(255,163,26,.9)}
.score.blaze .pot b{animation:shakey .3s steps(2) infinite}
.score.hot .box.mlt.bump,.score.blaze .box.mlt.bump{animation:bump .3s}
.score .x{font-family:var(--big);font-size:1.6rem;color:var(--ink-dim)}
.pot{text-align:center;min-width:0} .pot b{font-size:2.1rem;color:var(--gold)}
.bprog{height:8px;border-radius:99px;background:var(--panel-in);overflow:hidden}
.bprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple),var(--red));transition:width .2s}
.gridwrap{position:relative;container-type:inline-size}
.grid{display:grid;grid-template-columns:repeat(var(--w),1fr);gap:3px;container-type:inline-size;width:100%;max-width:min(calc(var(--w) * 58px),72vh);margin-inline:auto;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--panel-in);padding:5px;border-radius:12px}
.c{aspect-ratio:1;border:0;border-radius:5px;padding:0;display:grid;place-items:center;cursor:pointer;background:var(--tile);
  box-shadow:inset 0 3px 0 var(--tile-hi),inset 0 -4px 0 var(--tile-lo);font-family:var(--big);font-size:calc(100cqw / var(--w) * .8);line-height:1;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .08s,filter .08s;-webkit-touch-callout:none;min-width:0}
.c:hover{transform:translateY(-2px) rotate(-3deg);filter:brightness(1.12)}
.c svg{width:82%;height:82%;pointer-events:none}
.c.g{background:color-mix(in srgb,var(--tile),hsl(calc(130 - var(--p) * 130) 85% 50%) 62%)}
.c.o{background:var(--open);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);cursor:default;transform:none;filter:none;animation:pop .18s ease-out}
.c.o.n1{color:var(--blue)} .c.o.n2{color:var(--green)} .c.o.n3{color:var(--red)} .c.o.n4{color:var(--purple)}
.c.o.n5{color:var(--orange)} .c.o.n6{color:#43d9d0} .c.o.n7{color:var(--gold)} .c.o.n8{color:#fff}
.c.o.gem{background:linear-gradient(160deg,#ffe58a,#e0a800);color:#3b2b00;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px #fff3b0;animation:gempop .5s ease-out}
.c.o.gem.t-ruby{background:linear-gradient(160deg,#ffa59e,#d7372c);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.c.o.gem.t-diamond{background:linear-gradient(160deg,#d2fcff,#43d9d0);color:#0d3b3a}
.c.o.gem.t-jackpot{background:linear-gradient(120deg,#ffd23f,#fe5f55,#a275f0,#009dff,#ffd23f);background-size:300% 100%;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:gempop .5s ease-out,shimmer 1.2s linear infinite}
.c.o.gem svg{width:70%;height:70%}
.c.gemghost{background:rgba(255,210,63,.16);box-shadow:inset 0 0 0 2px rgba(255,210,63,.65);cursor:default;transform:none;filter:none}
.c.gemghost svg{opacity:.8;width:64%;height:64%}
.c.f{background:#e8eef0;box-shadow:inset 0 3px 0 #fff,inset 0 -4px 0 #9db0b5}
.c.mine{background:#4a2428;animation:pop .25s ease-out}
.c.mine.ghost{opacity:.5}
.c.boom{background:var(--red);animation:boom .4s ease-out}
.c.wf{background:#5b3b40;opacity:.7}
.c.probed{box-shadow:inset 0 0 0 3px var(--green)}
.c.defused{background:#c7f3dd}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.stamp span{font-family:var(--big);font-size:clamp(1.8rem,10cqw,3.6rem);line-height:1;padding:.12em .45em .18em;border-radius:12px;transform:rotate(-7deg);box-shadow:0 6px 0 rgba(0,0,0,.45);animation:stamp .35s cubic-bezier(.2,1.6,.4,1);text-align:center}
.stamp.win span{background:var(--green)} .stamp.lose span{background:var(--red)}
.stamp small{display:block;font-size:.42em;margin-top:.2em;line-height:1.1}
.float.big{font-size:2.3rem;animation-duration:1.5s;z-index:5}
.float{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--big);font-size:1.6rem;line-height:1;color:var(--fc);text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);white-space:nowrap;animation:floatup 1.1s ease-out forwards;z-index:4}
.bf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool{border:0;background:var(--panel-hi);box-shadow:0 3px 0 var(--shadow);border-radius:9px;height:40px;min-width:40px;padding:0 8px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-weight:700;font-size:.85rem}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--gold);color:#3b2b00;text-shadow:none}
.bf .cash{margin-left:auto}
.empty{min-height:210px;place-content:center;justify-items:center;text-align:center;background:rgba(17,24,26,.55);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.empty svg.big{width:68px;height:68px;animation:wobble 2.4s ease-in-out infinite}
.empty p{margin:0;color:var(--ink-dim)}

/* shop */
.side{display:grid;gap:18px;align-content:start;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:var(--panel-hi);box-shadow:0 3px 0 var(--shadow);border-radius:9px;padding:6px 4px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--orange);box-shadow:0 3px 0 var(--orange-lo)}
.shop{display:grid;gap:8px;max-height:560px;overflow-y:auto;padding-right:4px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-in);border-radius:12px;padding:8px}
.item svg.ii{width:44px;height:44px}
.item b{display:block;font-weight:700;line-height:1.15}
.item p{margin:0;font-size:.8rem;color:var(--ink-dim);text-shadow:none}
.item p em{color:var(--orange);font-style:normal}
.item .lv{font-size:.72rem;color:var(--gold)}
.item .btn{font-size:.85rem;padding:.35em .6em}
.item.done{opacity:.6}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;margin-top:3px}
.sw input{accent-color:var(--green);width:16px;height:16px}
.sec{font-family:var(--big);font-size:1.25rem;line-height:1;color:var(--ink-dim);margin:8px 2px 0}
.rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.offer{display:grid;justify-items:center;align-content:start;gap:6px;text-align:center;min-width:0}
.offer .price{background:var(--panel-in);border-radius:8px;padding:1px 10px;color:var(--gold);font-family:var(--big);font-size:1.4rem;line-height:1.1}
.offer p{margin:0;font-size:.75rem;color:var(--ink-dim);text-shadow:none;line-height:1.25}
.offer .btn{font-size:.85rem;padding:.35em .8em}
.offer.sold{opacity:.5}
.rackbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.stats dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0 0 12px}
.stats dt{color:var(--ink-dim)} .stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:1.1em;font-size:.85rem;color:var(--ink-dim);display:grid;gap:5px;text-shadow:none}
.toggles{display:flex;gap:8px 16px;flex-wrap:wrap;margin:14px 0 10px}

/* chat */
.chat{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;animation:slidein .25s ease-out}
.msg svg{width:34px;height:34px}
.bubble{background:var(--panel-in);border-radius:4px 12px 12px 12px;padding:5px 10px;text-shadow:none;min-width:0}
.bubble b{display:block;font-size:.75rem;color:var(--fc)}
.bubble span{font-size:.92rem}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(8,14,16,.72);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
.modal{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border-radius:18px;box-shadow:0 0 0 3px var(--rim),0 10px 0 3px var(--shadow);
  padding:22px 20px;text-align:center;display:grid;gap:14px;justify-items:center;animation:stamp .3s cubic-bezier(.2,1.4,.4,1)}
.modal h3{font-family:var(--big);font-weight:400;font-size:2.7rem;line-height:.95;margin:0;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5);text-wrap:balance}
.modal h3.red{color:var(--red)} .modal h3.purple{color:var(--purple)}
.modal p{margin:0;max-width:40ch}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal .warn{background:var(--red);border-radius:10px;padding:8px 12px;box-shadow:0 4px 0 var(--red-lo)}
.modal .bigicon{width:88px;height:88px}
.odds{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.odds div{background:var(--panel-in);border-radius:10px;padding:6px 12px;min-width:96px}
.odds small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim)}
.odds b{font-family:var(--big);font-weight:400;font-size:1.9rem;line-height:1;color:var(--gold)}
.trade{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%;text-align:left}
.trade li{background:var(--panel-in);border-radius:8px;padding:6px 10px 6px 30px;position:relative;text-shadow:none}
.trade li::before{position:absolute;left:10px;top:5px;font-weight:700}
.trade .bad::before{content:"−";color:var(--red)} .trade .good::before{content:"+";color:var(--green)}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4);pointer-events:none}
.hold span{position:relative}
.coinstage{perspective:700px;width:150px;height:150px}
.coin3d{width:150px;height:150px;position:relative;transform-style:preserve-3d}
.coin3d svg{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.coin3d svg.back{transform:rotateY(180deg)}
.picks{display:grid;gap:6px;width:100%}
.pick{aspect-ratio:1;border:0;border-radius:8px;background:var(--tile);box-shadow:inset 0 3px 0 var(--tile-hi),inset 0 -4px 0 var(--tile-lo),0 3px 0 var(--shadow);cursor:pointer;display:grid;place-items:center;padding:0}
.pick:hover:not(:disabled){transform:translateY(-2px) rotate(-3deg)}
.pick svg{width:78%;height:78%}
.pick.win{background:var(--green)} .pick.lose{background:var(--red)} .pick.rev{background:var(--open);box-shadow:none}
.pick:disabled{cursor:default}
.sides{display:flex;gap:10px}
.side-btn{border:0;border-radius:12px;background:var(--panel-in);box-shadow:0 3px 0 var(--shadow);padding:6px 14px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-weight:700}
.side-btn svg{width:48px;height:48px}
.side-btn[aria-pressed="true"]{background:var(--gold);color:#3b2b00;text-shadow:none}
.betrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.betrow input{width:9ch;font-family:var(--big);font-size:1.6rem;line-height:1;padding:4px 8px;border:0;border-radius:9px;background:var(--panel-in);color:var(--ink);text-align:right}
.betrow .btn{font-size:.85rem;padding:.35em .6em}
.roast{display:grid;gap:8px;width:100%;text-align:left}

.wheel{width:min(300px,76vw)}
.wheelsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.wl{font-family:var(--big);font-size:17px;fill:#fff;paint-order:stroke;stroke:#141b1d;stroke-width:3.5px;letter-spacing:.03em}
.wl.dark{fill:#3b2b00;stroke:#fff3b0}
.wres{min-height:1.5em}
.wres b{font-family:var(--big);font-weight:400;font-size:1.9rem;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.banner{position:fixed;left:50%;top:40%;z-index:80;pointer-events:none;transform:translate(-50%,-50%);text-align:center;display:grid;gap:6px;justify-items:center;width:max-content;max-width:94vw}
.banner b{font-family:var(--big);font-weight:400;font-size:clamp(3.2rem,13vw,7rem);line-height:.85;color:var(--gold);-webkit-text-stroke:2px #141b1d;text-shadow:0 7px 0 #141b1d,0 0 34px rgba(255,210,63,.55)}
.banner small{font-family:var(--big);font-size:clamp(1.3rem,4.5vw,2.1rem);line-height:1.1;background:#141b1d;color:#fff;padding:.08em .6em .14em;border-radius:10px}
.banner.red b{color:var(--red);text-shadow:0 7px 0 #141b1d,0 0 34px rgba(254,95,85,.6)}
.banner.orange b{color:var(--orange)} .banner.purple b{color:var(--purple);text-shadow:0 7px 0 #141b1d,0 0 34px rgba(162,117,240,.6)}
.banner.show{animation:banner 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
.coach{position:fixed;inset:0;z-index:90;pointer-events:none}
.coach-ring{position:fixed;border-radius:14px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px rgba(8,14,16,.55);pointer-events:none;animation:ringpulse 1.3s ease-in-out infinite}
.coach-ring.center{box-shadow:0 0 0 9999px rgba(8,14,16,.55);animation:none}
.coach-bubble{position:fixed;pointer-events:auto;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;background:var(--panel);border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 8px 0 3px var(--shadow);padding:14px}
.coach-bubble.in{animation:stamp .3s cubic-bezier(.2,1.4,.4,1)}
.coach-bubble .fuse{width:52px;height:52px;animation:bob 1s ease-in-out infinite}
.ctext{min-width:0}
.ctext p{margin:0 0 10px;line-height:1.35;text-shadow:none}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cstep{font-size:.75rem;color:var(--ink-dim);text-shadow:none}
.clink{background:none;border:0;color:var(--ink-dim);text-decoration:underline;cursor:pointer;padding:4px 2px;font:inherit;font-size:.8rem;text-shadow:none}
.crow .btn{margin-left:auto;font-size:.9rem;padding:.4em .8em}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--panel);box-shadow:0 0 0 3px var(--gold),0 5px 0 3px var(--shadow);border-radius:12px;padding:8px 14px;font-weight:700;text-align:center;animation:slideup .25s ease-out}
.quip{position:fixed;z-index:75;pointer-events:none;max-width:min(84vw,320px);font-family:var(--big);font-size:1.75rem;line-height:1.05;padding:.22em .55em .3em;border-radius:10px;
  background:var(--qc);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:0 5px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%) rotate(var(--qr));
  animation:quip 1.9s cubic-bezier(.2,1.5,.4,1) forwards;text-align:center;text-wrap:balance}

@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes boom{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes stamp{from{transform:scale(1.6) rotate(-7deg);opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-4px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bump{50%{transform:scale(1.14)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes jiggle{0%,100%{transform:none}20%{transform:rotate(-10deg) scale(1.12)}40%{transform:rotate(8deg) scale(1.12)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--red-lo),0 0 0 0 rgba(254,95,85,.55)}50%{box-shadow:0 4px 0 var(--red-lo),0 0 0 9px rgba(254,95,85,0)}}
@keyframes slidein{from{transform:translateX(-10px);opacity:0}}
@keyframes slideup{from{transform:translateY(12px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes flick{50%{filter:brightness(1.25) saturate(1.3)}}
@keyframes shakey{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}}
@keyframes goldglow{50%{box-shadow:0 0 0 3px #fff3b0,0 7px 0 3px var(--gold-lo),0 0 42px rgba(255,210,63,.7)}}
@keyframes gempop{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none}}
@keyframes shimmer{to{background-position:300% 0}}
@keyframes spinready{0%,100%{box-shadow:0 4px 0 var(--gold-lo),0 0 0 0 rgba(255,210,63,.65)}50%{box-shadow:0 4px 0 var(--gold-lo),0 0 0 10px rgba(255,210,63,0)}}
@keyframes spinicon{to{transform:rotate(360deg)}}
@keyframes ringpulse{50%{box-shadow:0 0 0 7px var(--gold),0 0 0 9999px rgba(8,14,16,.55)}}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);opacity:1}24%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-52%) scale(1) rotate(-4deg)}100%{transform:translate(-50%,-62%) scale(1.04) rotate(-4deg);opacity:0}}
@keyframes floatup{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-90%) scale(1.2);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
@keyframes quip{0%{transform:translate(-50%,-50%) rotate(var(--qr)) scale(.3);opacity:0}12%{transform:translate(-50%,-50%) rotate(var(--qr)) scale(1.08);opacity:1}22%{transform:translate(-50%,-50%) rotate(var(--qr)) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-75%) rotate(var(--qr)) scale(.96);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

     State ................. the Double or Nothing ladder, and the tutorial's steps          /state
     Memento ............... board snapshots + the save game                                /memento
     Factory Method ........ BoardFactory / AscendedBoardFactory (golden boards too)        /factory-method
     Flyweight ............. neighbour maps shared by every board of the same table         /flyweight
     Singleton ............. AudioEngine (one AudioContext for the whole page)              /singleton

    if (a >= v) return (n / v).toFixed(a / v < 100 ? 2 : 1).replace(/\.?0+$/, '') + s;
}
const fmtX = x => x >= 100 ? fmt(x) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
const fmtLim = x => Number.isInteger(x) ? fmt(x) : fmtX(x);

const Solver = {
  // Proves mines (KM) and safe tiles (KS) from the numbers alone. Player flags are ignored, so they can't game the odds.
  deduce(b, subset) {

        const H = []; let F = 0;
        for (const j of b.nb[i]) { if (KM[j]) F++; else if (!b.open[j] && !KS[j]) H.push(j); }
        if (!H.length) continue;
        const r = b.num[i] - F;
        if (r === H.length) { for (const j of H) KM[j] = 1; changed = true; }
        else if (r === 0) { for (const j of H) KS[j] = 1; changed = true; }
        else info.push({ H, r });
      }
      if (changed || !subset) continue;
      outer: for (const A of info) for (const B of info) {
        if (A === B || A.H.length >= B.H.length || !A.H.every(x => B.H.includes(x))) continue;
        const diff = B.H.filter(x => !A.H.includes(x)), dr = B.r - A.r;
        if (dr === 0) { for (const j of diff) KS[j] = 1; changed = true; break outer; }
        if (dr === diff.length) { for (const j of diff) KM[j] = 1; changed = true; break outer; }

    const glob = unk ? Math.max(0, Math.min(1, (b.m - km) / unk)) : 0;
    for (let i = 0; i < b.n; i++) {
      if (!b.open[i] || !b.num[i]) continue;
      const H = []; let F = 0;
      for (const j of b.nb[i]) { if (KM[j]) F++; else if (!b.open[j] && !KS[j]) H.push(j); }
      if (!H.length) continue;
      const q = Math.max(0, Math.min(1, (b.num[i] - F) / H.length));

  slots: new Array(MAXB).fill(null),

  /* coins. fx describes where the money flies in from, for the view; the logic never waits for it. */
  setCoins(v, bump, fx) { S.coins = v; S.run.peak = Math.max(S.run.peak, v); S.life.bestPeak = Math.max(S.life.bestPeak, v); bus.emit('coins', { bump, fx }); },
  spend(n) { if (S.coins < n) return false; this.setCoins(S.coins - n); return true; },

  /* stakes & tables */
  clampStake(t, v) { const hi = Math.min(effCap(t), S.coins); return Math.max(t.min, Math.min(Math.floor(v), hi)); },
  stakeFor(t) { return this.clampStake(t, S.stakes[t.id] ?? nice(Math.max(t.min, S.coins / 5))); },
  stakeBounds(t) { return [t.min, Math.max(t.min, Math.min(effCap(t), S.coins))]; },
  setStake(t, v) { S.stakes[t.id] = this.clampStake(t, v); bus.emit('stake'); SaveGame.save(); },
  selectTable(t) { S.sel = t.id; bus.emit('table:selected', { t }); SaveGame.save(); },
  unlockTable(t) {
    if (S.unlocked.includes(t.id)) return this.selectTable(t);
    if (!this.spend(t.cost)) return UI.toast(`${t.name} costs ${fmt(t.cost)} to unlock.`);
    S.unlocked.push(t.id); S.sel = t.id; Rack.roll();
    bus.emit('table:unlocked', { t }); SaveGame.saveNow();
  },

  /* boards */
  deal(slot, tid = S.sel, quiet = false) {
    const t = TBY[tid];
    if (this.slots[slot]) return false;
    if (S.coins < t.min) { if (!quiet) UI.toast(`You need ${fmt(t.min)} coins to sit at ${t.name}.`); return false; }
    const stake = this.stakeFor(t);
    let golden = Math.random() < GOLDEN * (hasA('midas') ? 3 : 1);
    if (S.goldNext > 0) { S.goldNext--; golden = true; }
    S.run.boards++; S.life.boards++;
    const b = boardFactory().create(slot, t, stake, golden);
    this.slots[slot] = b;
    this.setCoins(S.coins - stake);
    bus.emit('board:dealt', { b, quiet, big: !quiet && stake >= Math.max(500, (S.coins + stake) * .4) });
    SaveGame.saveNow();
    return true;
  },
  dealAll() {
    let n = 0;
    for (let s = 0; s < boardCount(); s++) { if (this.slots[s]) continue; if (!this.deal(s, S.sel, n > 0)) break; n++; }
    if (!n && this.slots.slice(0, boardCount()).every(Boolean)) UI.toast('All your boards are already in play.');
  },
  dig(b, i, src = 'you') {
    if (b.over || b.open[i] || b.flag[i]) return;
    if (src === 'you' || src === 'probe') b.human = true;
    if (!b.started) {
      b.placeMines(i); b.started = true; const opened = b.flood(i); b.base = b.revealed; b.t0 = Date.now();
      b.placeGems(b.gemsTotal);
      bus.emit('board:cells', { b, cells: opened });
      this.tileAddons(b, i, opened, 0);
      bus.emit('dig', { b, i, src, risk: 0 });
      return this.after(b);
    }
    // How risky was this dig? Provably safe and probed tiles pay nothing extra.
    let p = 0;
    if (src !== 'probe') { const d = Solver.full(b); if (!d.KS[i]) p = Math.min(.95, d.P[i]); }
    if (b.mine[i]) { b.combo = 0; mineChain.handle(b, i, src); return; }
    const opened = b.flood(i);
    bus.emit('board:cells', { b, cells: opened });
    if (p > 0) {
      let bonus = BOOST * (1 + .25 * asc()) * p / (1 - p);
      if (hasA('daredevil')) { bonus *= 1.3; bus.emit('addon:fired', { id: 'daredevil' }); }
      if (hasA('glass')) { bonus *= 2; bus.emit('addon:fired', { id: 'glass' }); }
      const k = 1 + bonus; b.G *= k; b.guesses++; b.combo++;
      bus.emit('board:risky', { b, i, k, p, src, combo: b.combo });
    }
    this.collectGems(b, opened);
    this.tileAddons(b, i, opened, p);
    bus.emit('dig', { b, i, src, risk: p });
    this.after(b);
  },
  collectGems(b, opened) {
    for (const j of opened) {
      const x = b.gem[j]; if (!x) continue;
      b.J *= x; b.gemsFound++; S.life.gems++;
      const tier = gemTier(x); if (tier.k === 'jackpot') S.life.jackpots++;
      bus.emit('board:gem', { b, i: j, x, tier });
    }
  },
  tileAddons(b, i, opened, p) {
    const fire = (id, cell, k, text) => { b.G *= k; bus.emit('addon:fired', { id, b, i: cell, text }); };
    if (p > 0 && hasA('corner') && b.isCorner(i)) fire('corner', i, 1.25, 'Corner ×1.25');
    if (p > 0 && hasA('nester') && opened.length >= 10) fire('nester', i, 1.3, 'Nester ×1.3');
    if (hasA('sevens')) { const s = opened.filter(j => b.num[j] === 7); if (s.length) fire('sevens', s[0], 1.77 ** s.length, `Sevens ×${(1.77 ** s.length).toFixed(2)}`); }
    if (hasA('eight')) { const s = opened.filter(j => b.num[j] === 8); if (s.length) fire('eight', s[0], 8 ** s.length, `Eight Ball ×${8 ** s.length}`); }
  },
  defuse(b, i, by) {
    b.flag[i] = 1; b.defused.add(i);
    bus.emit('board:cells', { b, cells: [i] }); bus.emit('board:defused', { b, i, by });
    this.after(b); SaveGame.saveNow();
  },
  toggleFlag(b, i, src = 'you') {
    if (b.over || b.open[i] || b.defused.has(i)) return;
    b.flag[i] ^= 1;
    bus.emit('board:cells', { b, cells: [i] }); bus.emit('flag', { b, i, on: !!b.flag[i], src });
    SaveGame.save();
  },
  chord(b, i, src = 'you') {
    if (!b.open[i] || !b.num[i]) return;
    let f = 0; for (const j of b.nb[i]) f += b.flag[j];
    if (f !== b.num[i]) return;
    for (const j of b.nb[i]) if (!b.open[j] && !b.flag[j]) { this.dig(b, j, src); if (b.over) return; }
  },
  probesFor: b => S.inv.probe + (b.fp || 0),
  probe(b, i) {
    if (b.open[i] || b.flag[i]) return;
    if (!b.started) return this.dig(b, i);
    if (this.probesFor(b) <= 0) { b.mode = 'dig'; return bus.emit('board:tools', { b }); }
    if (b.fp > 0) b.fp--; else S.inv.probe--;
    b.mode = 'dig'; b.probed.add(i); bus.emit('board:tools', { b }); bus.emit('inventory');
    if (b.mine[i]) { b.flag[i] = 1; bus.emit('board:cells', { b, cells: [i] }); bus.emit('probe', { b, i, mine: true }); SaveGame.saveNow(); }
    else this.dig(b, i, 'probe');
  },
  after(b) {
    if (b.over) return;
    if (b.revealed >= b.safe) {
      if (hasA('speed') && b.t0 && Date.now() - b.t0 <= 25000) { b.G *= 1.5; bus.emit('addon:fired', { id: 'speed', b, i: null, text: 'Speed Demon ×1.5' }); }
      return this.cashOut(b, 'clear');
    }
    if (b.rawMult() >= b.lim) return this.cashOut(b, 'limit');
    bus.emit('board:hud', { b }); SaveGame.save();
  },
  explode(b, i, src) {
    b.over = true; b.result = `Lost ${fmt(b.stake)}`; S.streak = 0; S.run.losses++;
    bus.emit('board:boom', { b, i, src, left: b.safe - b.revealed, missed: b.hiddenGems() }); bus.emit('board:hud', { b }); bus.emit('coins', {});
    SaveGame.saveNow();
    setTimeout(() => this.endBoard(b), 1700);
  },
  cashOut(b, why = 'manual') {
    if (b.over || !b.started) return;
    const { amount, extras } = buildPayout().pay(b, why);
    extras.forEach(([id, text]) => bus.emit('addon:fired', { id, b, i: null, text }));
    const profit = amount - b.stake, mult = b.mult();
    b.over = true; b.result = `Paid ${fmt(amount)}`; S.run.wins++;
    if (profit > 0 && (b.frac() >= .5 || mult >= 2)) { S.streak++; bus.emit('streak', { n: S.streak }); }
    S.run.biggest = Math.max(S.run.biggest, profit);
    this.setCoins(S.coins + amount, true, { from: b, amount, human: b.human });
    bus.emit('board:cashout', { b, why, amount, profit, mult, missed: b.hiddenGems() }); bus.emit('board:hud', { b });
    SaveGame.saveNow();
    setTimeout(() => this.endBoard(b), why === 'clear' || why === 'limit' ? 1600 : 1100);
  },
  endBoard(b) {
    if (this.slots[b.slot] !== b) return;
    this.slots[b.slot] = null; bus.emit('board:ended', { b });
    if (on('restake') && b.slot < boardCount() && S.coins >= b.t.min && S.unlocked.includes(b.t.id)) {
      const keep = S.stakes[b.t.id]; S.stakes[b.t.id] = b.stake;
      const ok = this.deal(b.slot, b.t.id, true); S.stakes[b.t.id] = keep;
      if (ok) { const nb = this.slots[b.slot]; setTimeout(() => { if (this.slots[b.slot] === nb && !nb.started) invoke(new DigCommand(nb, Math.floor(nb.t.h / 2) * nb.t.w + Math.floor(nb.t.w / 2), 'bot')); }, 350); }
    }
    this.checkBust(); SaveGame.saveNow();
  },

  /* shop */
  nextCost: u => u.costs[lvl(u.id)],
  gate(u) {
    if (u.req && !has(u.req)) return `Needs ${UBY[u.req].name}.`;
    if (u.id === 'boards') { const L = lvl('boards'); if (L >= 3 && L < 7 && asc() < L - 2) return `Needs Ascension ${ROMAN[L - 2]}.`; }
    return null;
  },
  buyUpgrade(u) {
    const cost = this.nextCost(u); if (cost == null || this.gate(u) || !this.spend(cost)) return;
    S.upg[u.id] = lvl(u.id) + 1; if (u.toggle) S.tog[u.id] = true;
    bus.emit('upgrade:bought', { u }); SaveGame.saveNow();
  },
  setToggle(id, v) { S.tog[id] = v; bus.emit('toggles'); SaveGame.saveNow(); },
  consumables() {
    const t = TBY[S.sel], k = hasA('bulk') ? .5 : 1, c = tableCap(t);
    return [
      { id: 'shield', name: 'Shield', icon: 'shield', cost: Math.ceil(c * .3 * k), desc: hasA('glass') ? 'Glass Jaw has switched shields off.' : `Survive one mine. You have ${S.inv.shield}.` },
      { id: 'probe', name: 'Probe', icon: 'probe', cost: Math.ceil(c * .1 * k), desc: `Check one tile before you dig it. You have ${S.inv.probe}.` }];
  },
  buyConsumable(c) { if (!this.spend(c.cost)) return; S.inv[c.id]++; bus.emit('inventory'); bus.emit('purchase'); SaveGame.saveNow(); },

  /* add-ons */
  buyAddon(k) {
    const id = S.rack[k]; if (!id) return;
    if (S.addons.length >= slotsMax()) return UI.toast('No room. Sell a card first.');
    const price = Rack.price(id); if (!this.spend(price)) return;
    S.addons.push({ id, paid: price }); S.rack[k] = null;
    bus.emit('addon:bought', { id }); SaveGame.saveNow();
  },
  sellAddon(k) {
    const a = S.addons[k]; if (!a) return;
    S.addons.splice(k, 1); bus.emit('addon:changed'); this.setCoins(S.coins + Math.floor(a.paid / 2), true); SaveGame.saveNow();
  },
  dropAddon(id) { const k = S.addons.findIndex(a => a.id === id); if (k < 0) return; S.addons.splice(k, 1); bus.emit('addon:burned', { id }); bus.emit('addon:changed'); SaveGame.saveNow(); },
  giveRandomAddon() {
    const pool = ADDONS.filter(a => !hasA(a.id)); if (!pool.length || S.addons.length >= slotsMax()) return null;
    const tot = pool.reduce((s, a) => s + RAR[a.r].w, 0); let x = Math.random() * tot, pick = pool[pool.length - 1];
    for (const a of pool) { x -= RAR[a.r].w; if (x <= 0) { pick = a; break; } }
    S.addons.push({ id: pick.id, paid: Rack.price(pick.id) }); S.rack = S.rack.map(id => id === pick.id ? null : id);
    return pick.id;
  },

  /* free spin: the prize is decided and saved the moment you spin, then the wheel catches up */
  spinIn: () => Math.max(0, SPIN_EVERY - (S.run.time - S.spinAt)),
  spin() {
    if (this.spinIn() > 0) return null;
    const k = Math.floor(Math.random() * WHEEL.length), w = WHEEL[k], base = baseCap();
    const prize = { k, kind: w.k, coins: 0, card: null, text: '' };
    if (w.k === 'coins' || w.k === 'jackpot') { prize.coins = Math.round(base * w.x); prize.text = `+${fmt(prize.coins)} coins`; }
    else if (w.k === 'golden') { S.goldNext += 2; prize.text = 'Your next 2 boards are golden'; }
    else if (w.k === 'shield') { S.inv.shield += 2; prize.text = '+2 shields'; }
    else if (w.k === 'probe') { S.inv.probe += 3; prize.text = '+3 probes'; }
    else if (w.k === 'card') {
      prize.card = this.giveRandomAddon();
      if (prize.card) prize.text = `Free card: ${ABY[prize.card].name}`;
      else { prize.coins = base; prize.text = `No room for a card, so +${fmt(base)} coins`; }
    }
    S.spinAt = S.run.time;
    if (prize.coins) S.coins += prize.coins;
    SaveGame.saveNow();
    return prize;
  },

  /* the big ones */
  canAscend() { const need = ASC[asc()]; return need && S.coins >= need.cost && boardCount() >= need.boards; },
  ascend() {
    const A = asc(), need = ASC[A]; if (!this.canAscend() || !this.spend(need.cost)) return false;
    S.asc = A + 1; S.life.bestAsc = Math.max(S.life.bestAsc || 0, S.asc);
    bus.emit('ascended', { level: S.asc }); SaveGame.saveNow(); return true;
  },
  buyCasino() { if (S.owned || !this.spend(CASINO)) return; S.owned = true; S.life.casinos++; bus.emit('casino'); SaveGame.saveNow(); },
  flip(bet, side) {
    const win = Math.random() < Math.min(.95, .5 * luck());
    S.coins += win ? bet : -bet; SaveGame.saveNow();
    return { win, face: win === (side === 'smile') };
  },

  /* busting */
  lastRun: null,
  bust(reason, deferModal) {
    this.lastRun = { ...S.run, reason };
    S.life.busts++; S.life.time += S.run.time;
    this.slots.fill(null);
    S = freshRun(S.life, { muted: S.muted, crt: pref('crt'), quips: pref('quips'), odd: pref('odd') });
    Rack.roll(); SaveGame.saveNow();
    if (!deferModal) UI.showBust(reason);
  },
  resetRun() { this.bust('manual', true); S.life.busts--; SaveGame.saveNow(); bus.emit('reset'); UI.toast('Fresh run. Same friends.'); },
  checkBust() { if (S.coins < TABLES[0].min && !this.slots.some(Boolean) && UI.modalClosed()) this.bust('broke'); },
};

/* =====================================================================================
   Command · https://refactoring.guru/design-patterns/command
   ===================================================================================== */
class Command { constructor(b, i, src = 'you') { this.b = b; this.i = i; this.src = src; } execute() {} }
class DigCommand extends Command { execute() { Game.dig(this.b, this.i, this.src); } }
class FlagCommand extends Command { execute() { Game.toggleFlag(this.b, this.i, this.src); } }
class ChordCommand extends Command { execute() { Game.chord(this.b, this.i, this.src); } }
class ProbeCommand extends Command { execute() { Game.probe(this.b, this.i); } }
class CashOutCommand extends Command { constructor(b, why = 'manual') { super(b, null, why); } execute() { Game.cashOut(this.b, this.src); } }
function invoke(cmd) { if (!cmd.b || cmd.b.over || Game.slots[cmd.b.slot] !== cmd.b) return; cmd.execute(); }

/* =====================================================================================
   Strategy · https://refactoring.guru/design-patterns/strategy
   Each bot may propose one command for a board. The first active one wins.
   ===================================================================================== */
const BOTS = [
  { id: 'goblin', active: () => has('flagBot'),
    next(b) { const d = Solver.forBots(b); for (let i = 0; i < b.n; i++) if (d.KM[i] && !b.flag[i] && !b.open[i]) return new FlagCommand(b, i, 'bot'); return null; } },
  { id: 'autominer', active: () => has('sweepBot'),
    next(b) { const d = Solver.forBots(b); for (let i = 0; i < b.n; i++) if (d.KS[i] && !b.open[i]) return b.flag[i] ? new FlagCommand(b, i, 'bot') : new DigCommand(b, i, 'bot'); return null; } },
  { id: 'yolo', active: () => has('sweepBot') && on('yolo'),
    next(b) {
      const P = Solver.full(b).P; let best = -1, bp = 2;
      for (let i = 0; i < b.n; i++) { if (b.open[i] || b.flag[i] || P[i] >= 1) continue; const v = P[i] + Math.random() * 1e-4; if (v < bp) { bp = v; best = i; } }
      return best >= 0 && (!on('coward') || bp <= .25) ? new DigCommand(b, best, 'yolo') : null;
    } },
  { id: 'coward', active: () => has('sweepBot') && on('coward'), next: b => new CashOutCommand(b, 'coward') },
];
const Bots = {
  timer: 0,
  delay: () => [520, 320, 180, 90][lvl('overclock')] * (hasA('oil') ? .6 : 1),
  tick() {
    try {
      for (const b of Game.slots) {
        if (!b || !b.started || b.over) continue;
        for (const bot of BOTS) { if (!bot.active()) continue; const cmd = bot.next(b); if (cmd) { invoke(cmd); break; } }
      }
    } finally { this.timer = setTimeout(() => this.tick(), this.delay()); }
  },
};

/* ---------- the add-on rack ---------- */
const Rack = {
  scale() { return baseCap() / 100; },
  price(id) { return Math.ceil(RAR[ABY[id].r].base * this.scale()); },
  rerollCost() { return Math.ceil(15 * this.scale() * (1 + S.rerolls)); },
  restockIn: () => Math.max(0, RESTOCK - (S.run.time - S.rackAt)),
  roll(keepTimer) {
    const pool = ADDONS.filter(a => !hasA(a.id)), out = [];
    for (let k = 0; k < 3 && pool.length; k++) {
      const tot = pool.reduce((s, a) => s + RAR[a.r].w, 0); let x = Math.random() * tot, pick = pool.length - 1;
      for (let j = 0; j < pool.length; j++) { x -= RAR[pool[j].r].w; if (x <= 0) { pick = j; break; } }
      out.push(pool[pick].id); pool.splice(pick, 1);
    }
    S.rack = out;
    if (!keepTimer) { S.rackAt = S.run.time; S.rerolls = 0; }
    bus.emit('rack');
  },
  reroll() { const c = this.rerollCost(); if (!Game.spend(c)) return false; const n = S.rerolls + 1; this.roll(true); S.rerolls = n; bus.emit('rack'); SaveGame.saveNow(); return true; },
  tick() { if (this.restockIn() <= 0) { this.roll(); UI.toast('Fresh add-ons in the rack.'); } },
};

/* ---------- rank: lifetime levels that survive busting ---------- */
const Rank = {
  award(xp) {
    const L = S.life; L.xp += Math.max(0, Math.round(xp));
    while (L.xp >= xpNeed(L.lvl)) {
      L.xp -= xpNeed(L.lvl); L.lvl++;
      const before = rankName(L.lvl - 1), name = rankName(L.lvl);
      let coins = Math.round(baseCap() * (.6 + .04 * L.lvl)), extra = '';
      if (L.lvl % 3 === 0) { S.inv.shield++; extra = ' + a shield'; }
      if (L.lvl % 5 === 0) { const id = Game.giveRandomAddon(); if (id) extra += ` + ${ABY[id].name}`; else coins = Math.round(coins * 1.5); }
      S.coins += coins;
      bus.emit('levelup', { lvl: L.lvl, name, newRank: name !== before, coins, extra });
    }
    bus.emit('xp');
    SaveGame.save();
  },
};

/* =====================================================================================
   State · https://refactoring.guru/design-patterns/state
   Double or Nothing moves Offer → Confirm → Resolve → Won/Lost.
   ===================================================================================== */
const donChance = step => Math.min(.95, (1 / LADDER[step]) * luck());
const SURE = ['Are you sure?', 'Are you SURE sure?', 'Mate. Are you actually sure?', 'This is where sensible people stop.', 'Nan is crying. Are you sure?'];
class DonState { constructor(ladder, step) { this.ladder = ladder; this.step = step; } enter() {} }
class OfferState extends DonState {
  enter() {
    const m = LADDER[this.step], stake = S.coins;
    bus.emit('don:offer', { step: this.step });
    UI.modal(`${ico('dice', 'bigicon')}<h3>${this.step ? `Let it ride: ×${m}?` : 'Double or nothing'}</h3>
      <div class="odds"><div><small>You stake</small><b class="num">${fmt(stake)}</b></div><div><small>You could have</small><b class="num">${fmt(stake * m)}</b></div><div><small>Chance</small><b class="num">${pct(donChance(this.step))}</b></div></div>
      <p class="warn">Lose and the whole run resets. Coins, tables, cards, bots, Ascension. Everything.</p>
      <div class="row"><button class="btn red big" type="button" data-a="go">I’m in</button><button class="btn ghost" type="button" data-a="no">${this.step ? `Walk away with ${fmt(stake)}` : 'Not today'}</button></div>`,
      { go: () => this.ladder.go(new ConfirmState(this.ladder, this.step)),
        no: () => { this.ladder.end(); if (this.step) { Sound.cash(); UI.toast(`Walked away with ${fmt(S.coins)}. Smart. Boring, but smart.`); } } }, this.step > 0);
  }
}
class ConfirmState extends DonState {
  enter() {
    UI.modal(`${ico('skull', 'bigicon')}<h3 class="red">${SURE[this.step]}</h3>
      <p>${fmt(S.coins)} coins on a ${pct(donChance(this.step))} shot. If it goes wrong, you start again from ${fmt(START)}.</p>
      <button class="btn red big hold" type="button" id="holdBtn"><i></i><span>Hold to risk it all</span></button>
      <button class="btn ghost" type="button" data-a="no">Chicken out</button>`,
      { no: () => this.step ? this.ladder.go(new OfferState(this.ladder, this.step)) : this.ladder.end() }, this.step > 0);
    UI.holdButton($('#holdBtn'), 1300, () => this.ladder.go(new ResolveState(this.ladder, this.step)));
  }
}
class ResolveState extends DonState {
  enter() {
    // The result is decided and saved before the animation, so reloading can't change it.
    const m = LADDER[this.step], win = Math.random() < donChance(this.step);
    if (win) {
      S.coins = Math.floor(S.coins * m); S.run.peak = Math.max(S.run.peak, S.coins); S.life.bestPeak = Math.max(S.life.bestPeak, S.coins);
      S.run.don++; S.life.donBest = Math.max(S.life.donBest, this.step + 1); SaveGame.saveNow();
    } else Game.bust('don', true);
    const next = () => this.ladder.go(win ? new WonState(this.ladder, this.step) : new LostState(this.ladder, this.step));
    this.step === 0 ? this.flip(win, next) : this.pick(win, next);
  }
  flip(win, next) {
    Sound.drum(18);

/* ---------- swirling felt background (WebGL, pixelated) ---------- */
const Background = (() => {

    [[.12, .36, .28], [.04, .17, .13], [.2, .55, .4]],
    [[.08, .28, .42], [.02, .1, .18], [.18, .5, .68]],

    [[.46, .1, .16], [.14, .03, .06], [.76, .22, .28]],
    [[.22, .18, .08], [.04, .03, .02], [.86, .66, .2]],
  ];
  const MOODS = {
    hot: [[.55, .33, .08], [.17, .07, .03], [.95, .6, .12], 1.6],
    danger: [[.62, .14, .14], [.05, .13, .36], [.9, .3, .25], 2.6],
    bust: [[.26, .05, .07], [.06, .02, .03], [.45, .08, .12], .5],
    asc: [[.4, .24, .62], [.07, .04, .15], [.95, .8, .3], 2.2],
    gold: [[.5, .4, .1], [.12, .08, .02], [1, .85, .35], 2.4],
  };
  const cv = $('#bg'), st = { c: FELTS[0].map(c => c.slice()), spin: 1, t: 0 };
  let target = [...FELTS[0], 1], gl = null, U = {}, last = 0;
  try { gl = cv.getContext('webgl', { antialias: false, depth: false, alpha: false }); } catch (e) { gl = null; }
  if (gl) {

    const fs = `precision mediump float;uniform vec2 R;uniform float T;uniform vec3 A;uniform vec3 B;uniform vec3 C;
    void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);float r=length(uv);
    float a=atan(uv.y,uv.x)+T*.06+r*2.4-T*.04*r;vec2 p=vec2(cos(a),sin(a))*r*2.6;
    for(int i=0;i<5;i++){float fi=float(i);p+=.55*vec2(sin(p.y*1.7+T*.23+fi),cos(p.x*1.5-T*.19+fi*1.3));}
    float v=.5+.5*sin(p.x*1.2+p.y*.8);float w=.5+.5*sin(length(p)*1.8-T*.3);
    vec3 col=mix(B,A,smoothstep(.15,.85,v));col=mix(col,C,smoothstep(.6,.95,w)*.85);
    col=floor(col*14.)/14.;col*=1.-.32*r;gl_FragColor=vec4(col,1.);}`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs), pr = v && f && gl.createProgram();

  };
})();

/* ---------- particles: confetti and flying coins share one canvas ---------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d'); let parts = [], coins = [], running = false;
  const cols = ['#fe5f55', '#009dff', '#3fc18a', '#ffd23f', '#ffa31a', '#a275f0'];
  const size = () => { const w = innerWidth * devicePixelRatio, h = innerHeight * devicePixelRatio; if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } };
  function loop(now) {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);

      p.vy += .45; p.vx *= .985; p.x += p.vx; p.y += p.vy;
      const s = Math.round(p.r); ctx.fillStyle = '#141b1d'; ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, s + 2, s + 2);
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
    }

      const t = (now - c.t0) / c.dur; if (t < 0) return true;
      if (t >= 1) { if (c.land) c.land(); return false; }
      const e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2, u = 1 - e;
      const x = u * u * c.x0 + 2 * u * e * c.cx + e * e * c.x1, y = u * u * c.y0 + 2 * u * e * c.cy + e * e * c.y1, r = c.r * (1 - .35 * e);
      ctx.fillStyle = '#141b1d'; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff6b0'; ctx.fillRect(Math.round(x - r * .45), Math.round(y - r * .5), Math.max(2, r * .35), Math.max(2, r * .35));
      return true;
    });
    if (parts.length || coins.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  const go = () => { if (!running) { running = true; size(); requestAnimationFrame(loop); } };
  const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, ok: r.width > 0 && r.bottom > 0 && r.top < innerHeight }; };
  return {
    confetti(n = 140, from) {
      if (reduced) return; size();
      const ox = from ? from.x : innerWidth / 2, oy = from ? from.y : innerHeight * .45;
      for (let k = 0; k < n; k++) parts.push({ x: ox + (Math.random() - .5) * 200, y: oy, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 5 + 4, c: rnd(cols), life: 90 + Math.random() * 50 });

    },
    // Coins fly from an element (or point) to the bank. Returns how long until the first and last land.
    coins(from, n, onLand) {

      const a = from && from.getBoundingClientRect ? center(from) : from, b = center(bank);
      if (reduced || !a || !a.ok || coins.length > 160) n = 0;
      const now = performance.now(), stagger = 45, flight = 620;

        const x0 = a.x + (Math.random() - .5) * 40, y0 = a.y + (Math.random() - .5) * 24;
        coins.push({ x0, y0, x1: b.x, y1: b.y, cx: (x0 + b.x) / 2 + (Math.random() - .5) * 260, cy: Math.min(y0, b.y) - 80 - Math.random() * 140,

const StakeView = {
  range: $('#stakeRange'), lastShown: '',
  render() {
    const t = TBY[S.sel], [lo, hi] = Game.stakeBounds(t), v = Game.stakeFor(t);
    this.range.disabled = S.coins < t.min || hi <= lo;
    this.range.value = hi > lo ? Math.round(1000 * Math.log(v / lo) / Math.log(hi / lo)) : 0;
    $('#stakeOut').textContent = this.lastShown = fmt(v);
    $('#tinfo').textContent = S.coins < t.min ? `You need ${fmt(t.min)} coins to play ${t.name}.`

  },
  bind() {
    this.range.addEventListener('input', () => {
      const t = TBY[S.sel], [lo, hi] = Game.stakeBounds(t);
      Game.setStake(t, nice(hi > lo ? lo * Math.pow(hi / lo, this.range.value / 1000) : lo));
      const shown = fmt(Game.stakeFor(t));
      if (shown !== this.lastShown) { this.lastShown = shown; Sound.slide(this.range.value / 1000); }
      $('#stakeOut').textContent = shown;

/* ---------- boards ---------- */

  },
  ensureSlots() {
    for (let s = this.root.children.length; s < boardCount(); s++) { const d = document.createElement('div'); d.dataset.slot = s; this.root.appendChild(d); this.render(s); }
  },
  renderEmpties() { for (let s = 0; s < boardCount(); s++) if (!Game.slots[s]) this.render(s); },
  render(s) {
    const holder = this.holder(s); if (!holder) return;
    const b = Game.slots[s], t = TBY[S.sel];
    if (!b) {
      const can = S.coins >= t.min;

    }

        <span class="bot-on" hidden title="Bots are working this board">${ico('bot')}</span>
        <span class="gemct" title="Gems found on this board">${ico('gem')}<b class="num">0/0</b></span>
        <span class="blim">${b.m} mines · limit ×${fmtLim(b.lim)}</span></div>
      <div class="score"><div class="box stk"><small>Stake</small><b class="num">${fmt(b.stake)}</b></div><span class="x">×</span>
        <div class="box mlt"><small>Mult</small><b class="num">1.00</b></div><span class="x">=</span><div class="pot"><small>Pot</small><b class="num">${fmt(b.stake)}</b></div></div>
      <div class="bprog"><i></i></div>
      <div class="gridwrap"><div class="grid" style="--w:${b.t.w}"></div></div>
      <div class="bf">
        <button class="tool t-flag" type="button" aria-pressed="false" title="Flag mode (tap to flag)">${ico('flag')}</button>
        <button class="tool t-probe" type="button" aria-pressed="false" title="Probe a tile safely">${ico('probe')}<span></span></button>
        <span class="tool" title="Shields: survive one mine each" style="cursor:default">${ico('shield')}<span class="t-sh"></span></span>
        <button class="btn green cash" type="button">${ico('chicken', 'ic')}<span>Cash out</span></button>
      </div>`;
    const grid = holder.querySelector('.grid'), frag = document.createDocumentFragment();
    b.cells = [];
    for (let i = 0; i < b.n; i++) { const c = document.createElement('button'); c.type = 'button'; c.dataset.i = i; b.cells.push(c); frag.appendChild(c); }
    grid.appendChild(frag);
    for (let i = 0; i < b.n; i++) this.cell(b, i);
    this.bindGrid(b, grid);
    holder.querySelector('.t-flag').onclick = () => { b.mode = b.mode === 'flag' ? 'dig' : 'flag'; this.tools(b); };
    holder.querySelector('.t-probe').onclick = () => { if (Game.probesFor(b) > 0) { b.mode = b.mode === 'probe' ? 'dig' : 'probe'; this.tools(b); } else UI.toast('No probes left. Buy some in the shop.'); };
    holder.querySelector('.cash').onclick = () => invoke(new CashOutCommand(b, 'manual'));
    b.lastM = 0; this.hud(b); this.tools(b); this.odds(b);
  },
  cell(b, i) {
    const c = b.cells && b.cells[i]; if (!c) return;
    const x = i % b.t.w + 1, y = ((i / b.t.w) | 0) + 1;
    if (b.open[i]) {
      const g = b.gem[i];
      c.className = 'c o' + (b.num[i] ? ' n' + b.num[i] : '') + (g ? ' gem t-' + gemTier(g).k : '') + (b.probed.has(i) ? ' probed' : '');
      if (g && !b.num[i]) c.innerHTML = ico('gem'); else c.textContent = b.num[i] || '';
      c.removeAttribute('title'); c.setAttribute('aria-label', `Row ${y} column ${x}: ${b.num[i] || 'empty'}${g ? ', gem' : ''}`);
    } else if (b.flag[i]) {
      c.className = 'c f' + (b.defused.has(i) ? ' defused' : '') + (b.probed.has(i) ? ' probed' : '');
      c.innerHTML = ico(b.defused.has(i) ? 'shield' : 'flag'); c.removeAttribute('title'); c.setAttribute('aria-label', `Row ${y} column ${x}: flagged`);
    } else {
      c.className = 'c'; c.textContent = ''; c.setAttribute('aria-label', `Row ${y} column ${x}: hidden`);
    }
  },
  bindGrid(b, grid) {
    let lp = 0, suppress = false;
    const cellOf = e => e.target.closest && e.target.closest('.c');
    grid.addEventListener('click', e => {
      const c = cellOf(e); if (!c) return;
      if (suppress) { suppress = false; return; }
      const i = +c.dataset.i;
      const cmd = b.mode === 'flag' ? (b.open[i] ? new ChordCommand(b, i) : new FlagCommand(b, i))
        : b.mode === 'probe' ? new ProbeCommand(b, i)
        : b.open[i] ? new ChordCommand(b, i) : new DigCommand(b, i);
      invoke(cmd);
      Quips.maybe(.03, e.clientX, e.clientY);
    });
    grid.addEventListener('contextmenu', e => { const c = cellOf(e); if (!c) return; e.preventDefault(); if (suppress) return; invoke(new FlagCommand(b, +c.dataset.i)); Quips.maybe(.04, e.clientX, e.clientY); });
    grid.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch') return; const c = cellOf(e); if (!c) return;
      clearTimeout(lp); suppress = false;
      lp = setTimeout(() => { suppress = true; invoke(new FlagCommand(b, +c.dataset.i)); if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} }, 380);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => grid.addEventListener(ev, () => clearTimeout(lp)));
    grid.addEventListener('keydown', e => { if (e.key !== 'f' && e.key !== 'F') return; const c = cellOf(e); if (!c) return; e.preventDefault(); invoke(new FlagCommand(b, +c.dataset.i)); });
  },
  hud(b) {
    if (!b.el) return;
    const m = b.mult(), mb = b.el.querySelector('.box.mlt'), sc = b.el.querySelector('.score');
    mb.querySelector('b').textContent = fmtX(m);
    if (b.lastM && m > b.lastM + 1e-9 && !reduced) { mb.classList.remove('bump'); void mb.offsetWidth; mb.classList.add('bump'); }
    b.lastM = m;
    sc.classList.toggle('hot', m >= 3 && m < 10); sc.classList.toggle('blaze', m >= 10);
    b.el.querySelector('.pot b').textContent = fmt(b.pot());
    b.el.querySelector('.bprog i').style.width = (b.frac() * 100).toFixed(1) + '%';
    b.el.querySelector('.gemct b').textContent = `${b.gemsFound}/${b.gemsTotal}`;
    b.el.querySelector('.gemct').classList.toggle('all', b.started && b.gemsFound >= b.gemsTotal && b.gemsTotal > 0);
    const cash = b.el.querySelector('.cash');
    cash.disabled = !b.started || b.over;
    cash.querySelector('span').textContent = b.result || (b.started ? `Cash out ${fmt(b.pot())}` : 'Dig a tile to start');
    b.el.querySelector('.bot-on').hidden = !(has('flagBot') && b.started && !b.over);
  },
  tools(b) {
    if (!b.el) return;
    b.el.querySelector('.t-flag').setAttribute('aria-pressed', b.mode === 'flag');
    const pr = b.el.querySelector('.t-probe'); pr.setAttribute('aria-pressed', b.mode === 'probe'); pr.querySelector('span').textContent = Game.probesFor(b);
    b.el.querySelector('.t-sh').textContent = hasA('glass') ? '×' : S.inv.shield;
  },
  odds(b) {
    if (!b.el || !b.cells) return;
    const show = on('goggles') && b.started && !b.over, P = show ? Solver.full(b).P : null;
    for (let i = 0; i < b.n; i++) {
      const c = b.cells[i]; if (!c || b.open[i] || b.flag[i]) continue;
      if (show) { c.classList.add('g'); c.style.setProperty('--p', P[i].toFixed(2)); c.title = `~${Math.round(P[i] * 100)}% mine`; }
      else if (c.classList.contains('g')) { c.classList.remove('g'); c.removeAttribute('title'); }
    }
  },
  stamp(b, text, kind, sub) {
    const w = b.el && b.el.querySelector('.gridwrap'); if (!w) return;
    const d = document.createElement('div'); d.className = 'stamp ' + kind; d.innerHTML = `<span>${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>`; w.appendChild(d);
  },
  float(b, i, text, color, big) {
    const wrap = b.el && b.el.querySelector('.gridwrap'); if (!wrap) return;
    const w = wrap.getBoundingClientRect(); let x = w.width / 2, y = w.height / 2;
    if (i != null && b.cells[i]) { const r = b.cells[i].getBoundingClientRect(); x = r.left - w.left + r.width / 2; y = r.top - w.top + r.height / 2; }
    else { b.floats = (b.floats || 0) + 1; y += (b.floats % 4) * 30 - 30; }
    const s = document.createElement('span'); s.className = 'float' + (big ? ' big' : ''); s.textContent = text;
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--fc', color);
    wrap.appendChild(s); setTimeout(() => s.remove(), big ? 1500 : 1150);
  },
  boom(b, i) {
    if (!b.el) return;
    b.cells[i].className = 'c boom'; b.cells[i].innerHTML = ico('bomb');
    if (!reduced) { b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake'); }
    const mines = [];
    for (let k = 0; k < b.n; k++) { if (b.mine[k] && k !== i && !b.flag[k]) mines.push(k); else if (b.flag[k] && !b.mine[k]) b.cells[k].className = 'c wf'; }
    mines.sort(() => Math.random() - .5);
    const step = Math.min(60, 900 / Math.max(1, mines.length));
    mines.forEach((k, n) => setTimeout(() => { if (!b.cells[k]) return; b.cells[k].className = 'c mine'; b.cells[k].innerHTML = ico('bomb'); }, 120 + n * step));
    this.ghostGems(b);
  },
  ghostMines(b) { if (!b.el) return; for (let k = 0; k < b.n; k++) if (b.mine[k] && !b.flag[k]) { b.cells[k].className = 'c mine ghost'; b.cells[k].innerHTML = ico('bomb'); } this.ghostGems(b); },
  ghostGems(b) { if (!b.el) return; for (let k = 0; k < b.n; k++) if (b.gem[k] && !b.open[k]) { b.cells[k].className = 'c gemghost'; b.cells[k].innerHTML = ico('gem'); } },
};

const SpinView = {

    const R = 130, cx = 140, cy = 140, n = WHEEL.length;

    WHEEL.forEach((w, k) => {

      s += `<path d="M${cx} ${cy}L${p(a0)}A${R} ${R} 0 0 1 ${p(a1)}Z" fill="${w.col}" stroke="#141b1d" stroke-width="3"/>`;
      const mid = (k + .5) * 360 / n;
      s += `<g transform="rotate(${mid} ${cx} ${cy})"><text x="${cx}" y="${cy - 40}" transform="rotate(-90 ${cx} ${cy - 40})" class="wl${w.k === 'golden' ? ' dark' : ''}" text-anchor="start" dominant-baseline="middle">${esc(this.label(w, base))}</text></g>`;
    });
    s += `</g><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#141b1d" stroke-width="6"/>`;
    for (let k = 0; k < n; k++) { const a = (k / n) * 2 * Math.PI - Math.PI / 2; s += `<circle cx="${(cx + (R - 4) * Math.cos(a)).toFixed(1)}" cy="${(cy + (R - 4) * Math.sin(a)).toFixed(1)}" r="3.5" fill="#fff" stroke="#141b1d" stroke-width="1.5"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="30" fill="#35474c" stroke="#141b1d" stroke-width="4"/><use href="#i-bomb" x="${cx - 22}" y="${cy - 24}" width="44" height="44"/>
      <path d="M${cx - 15} 2 H${cx + 15} L${cx} 30 Z" fill="#fe5f55" stroke="#141b1d" stroke-width="4" stroke-linejoin="round"/></svg>`;
    return s;
  },
  open() {
    const base = baseCap();
    UI.modal(`<h3>Free spin</h3><div class="wheel">${this.svg(base)}</div><p class="wres" id="wres">Twelve slices, all the same size. What you see is what you get.</p>
      <div class="row"><button class="btn gold big" type="button" id="spinGo">Spin it</button><button class="btn ghost" type="button" data-a="close">Later</button></div>`, { close: () => UI.closeModal() });
    $('#spinGo').onclick = () => this.go();
  },
  go() {
    const prize = Game.spin(); if (!prize) return;
    const go = $('#spinGo'); go.disabled = true; go.textContent = 'Spinning…'; UI.modalLocked = true;
    const close = $('[data-a="close"]', UI.el.box); if (close) close.hidden = true;
    const n = WHEEL.length, slice = 360 / n, from = S.wheel % 360;
    const targetMod = ((-(prize.k + .5) * slice + (Math.random() - .5) * slice * .7) % 360 + 360) % 360;
    const to = from + 360 * 5 + ((targetMod - from) % 360 + 360) % 360;
    const rot = $('#wheelRot'), T = reduced ? 1 : 4200, t0 = performance.now();
    let lastSeg = Math.floor(from / slice);
    const frame = now => {
      if (!rot.isConnected) return;
      const t = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - t, 4), a = from + (to - from) * e;
      rot.setAttribute('transform', `rotate(${a.toFixed(2)} 140 140)`);
      const seg = Math.floor(a / slice); if (seg !== lastSeg) { lastSeg = seg; Sound.wheel(1 - t); }
      if (t < 1) requestAnimationFrame(frame); else this.land(prize, to);
    };
    requestAnimationFrame(frame);
  },
  land(prize, angle) {
    S.wheel = angle % 360; SaveGame.save();

    const go = $('#spinGo'); go.disabled = false; go.textContent = 'Nice'; UI.modalLocked = false;

  },
};

const UiSounds = {
  bind() {
    let hovered = null;
    document.addEventListener('pointerdown', e => {
      const el = e.target.closest('button, label.sw'); if (!el || el.disabled) return;
      if (el.closest('.grid') || el.classList.contains('pick') || el.classList.contains('hold')) return;
      Sound.press();
    }, true);
    document.addEventListener('click', e => {
      const el = e.target.closest('button'); if (!el || el.disabled) return;
      if (el.matches('.tbl')) Sound.select(Math.max(0, TABLES.findIndex(t => t.id === el.dataset.t)));
      else if (el.matches('.quick button, .side-btn, .betrow .btn')) Sound.pop(el.dataset.q === 'max' || el.dataset.q === '1' ? 2 : 0);
      else if (el.matches('.acard')) Sound.card();
      else if (el.matches('.t-flag, .t-probe')) Sound.pop(1);
    }, true);
    if (matchMedia('(hover: hover)').matches) document.addEventListener('mouseover', e => {
      const el = e.target.closest('.btn, .tbl, .acard, .tabs button, .tool, .quick button');
      if (el === hovered) return; hovered = el;
      if (el && !el.disabled) Sound.hover();
    });
  },
};

const firstBoard = sel => { const b = Game.slots.find(Boolean); return b && b.el ? $(sel, b.el) : $('#boards'); };
const STEPS = [
  { text: 'Hi, I’m Fuse. I’m a bomb, but a friendly one. Let’s make you rich. Fake rich.', next: 'Let’s go' },
  { at: () => $('#bank'), text: 'This is your bank. The coins aren’t real. Lose them all and you’re stuffed: back to 1,000.' },

  { at: () => $('.stake'), text: 'Pick a stake, then deal. Bigger stake, bigger pot.', wait: 'board:dealt' },
  { at: () => firstBoard('.grid'), text: 'Dig a tile. Your first dig is always safe.', wait: 'dig:you' },
  { at: () => firstBoard('.score'), text: 'Numbers count the mines touching that tile. Safe digs nudge the Mult up. Risky digs, where you can’t be sure, pay the odds. Riskier means bigger.' },
  { at: () => firstBoard('.gemct'), text: 'Every board hides gems that multiply the pot: ×1.2 up to a ×5 jackpot. They’re never in the opening, so go digging.' },
  { at: () => firstBoard('.cash'), text: 'Cash out to bank the pot. Hit a mine and the stake is gone. Your call.', wait: 'board:over' },
  { at: () => $('.side .panel'), text: 'Spend it here: bots that play for you, more boards, and add-on cards that bend the rules.' },
  { at: () => $('#btnDon'), text: 'Double or Nothing bets everything. Win and it climbs to ×100. Lose and your whole run resets. Is it worth the risk?' },
  { text: 'That’s it. Go get rich, or get stuffed. My mum plays this game.', next: 'Let’s play' },
];
const Coach = {
  active: false, i: 0, raf: 0, target: null, seen: new Set(),
  el: { wrap: $('#coach'), ring: $('#coachRing'), bub: $('#coachBubble') },
  start(replay) {
    if (this.active) return;
    if (replay) Tabs.show('shop');
    this.active = true; this.seen.clear(); this.go(0);
    this.raf = requestAnimationFrame(() => this.track());
  },
  go(i) {
    this.i = i; const st = STEPS[i]; if (!st) return this.finish();
    const last = i === STEPS.length - 1;
    this.el.bub.innerHTML = `<svg viewBox="0 0 64 64" class="fuse" aria-hidden="true"><use href="#i-bomb"/></svg>
      <div class="ctext"><p>${esc(st.text)}</p>
      <div class="crow"><span class="cstep">${i + 1}/${STEPS.length}</span>${last ? '' : '<button class="clink" type="button" data-c="skip">Skip tutorial</button>'}
      <button class="btn ${st.wait ? 'ghost' : 'gold'}" type="button" data-c="next">${st.next || (st.wait ? 'Skip step' : 'Next')}</button></div></div>`;
    $$('[data-c]', this.el.bub).forEach(b => b.onclick = () => b.dataset.c === 'skip' ? this.finish() : this.go(this.i + 1));
    this.target = st.at ? st.at() : null;
    if (this.target) { const r = this.target.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 70) this.target.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }); }
    if (st.wait && this.seen.has(st.wait)) setTimeout(() => { if (this.active && this.i === i) this.go(i + 1); }, 900);
    this.el.wrap.hidden = false; this.el.bub.classList.remove('in'); void this.el.bub.offsetWidth; this.el.bub.classList.add('in');
    Sound.coach();
  },
  event(name) {
    if (!this.active) return; this.seen.add(name);
    if (STEPS[this.i] && STEPS[this.i].wait === name) { const i = this.i; setTimeout(() => { if (this.active && this.i === i) this.go(i + 1); }, 700); }
  },
  track() {
    if (!this.active) return;
    const st = STEPS[this.i], show = UI.modalClosed();
    this.el.wrap.hidden = !show;
    if (show) {
      if (st && st.at && (!this.target || !this.target.isConnected)) this.target = st.at();
      const vw = innerWidth, vh = innerHeight, bw = Math.min(380, vw - 32), bub = this.el.bub;
      bub.style.width = bw + 'px';
      const bh = bub.offsetHeight;
      if (this.target && this.target.isConnected) {
        const r = this.target.getBoundingClientRect(), pad = 6;
        Object.assign(this.el.ring.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
        this.el.ring.classList.remove('center');
        let top = r.bottom + 14 + pad;
        if (top + bh > vh - 12) top = r.top - bh - 14 - pad;
        if (top < 12) top = r.top + r.height / 2 > vh / 2 ? 12 : vh - bh - 12;
        const left = Math.min(vw - bw - 16, Math.max(16, r.left + r.width / 2 - bw / 2));
        bub.style.left = left + 'px'; bub.style.top = top + 'px';
      } else {
        Object.assign(this.el.ring.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px' });
        this.el.ring.classList.add('center');
        bub.style.left = (vw - bw) / 2 + 'px'; bub.style.top = Math.max(12, (vh - bh) / 2) + 'px';
      }
    }
    this.raf = requestAnimationFrame(() => this.track());
  },
  finish() {
    this.active = false; cancelAnimationFrame(this.raf); this.el.wrap.hidden = true;
    S.life.tut = true; SaveGame.saveNow(); Sound.select(3);
  },
};
